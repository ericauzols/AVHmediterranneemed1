   fiche(ICO.jeu,'Les épreuves',"Des épreuves rythment le voyage. Si l'une te bloque, tu peux la passer, mais cela a un prix.")+
   fiche(ICO.lecture,'Mode lecture et voix',"« Mode lecture » rend le texte plus facile à lire. « Écouter » lit la page à voix haute.")+
   fiche(ICO.relie,'Le bilan',"À la fin, tu classeras ce que tu as vu pendant ton voyage. Sous chaque image, un document d'époque s'agrandit d'un clic. Ouvre bien les yeux !")+
   '</div>'],
   function(){construireChoix($('choix'),[{l:'Commencer : le prologue',action:function(){aller('0');}}]);});
}
var BACS=[{id:'conflit',n:'Ce qui oppose',s:'guerres, rivalités, violences'},{id:'eco',n:'Ce qui relie : l\'économie',s:'commerce, monnaies, navires'},{id:'culture',n:'Ce qui relie : la culture',s:'arts, savoirs, jeux, langues, lieux saints'},{id:'gastro',n:'Ce qui relie : la table',s:'aliments, cuisine, manières de manger'}];
function listeClassee(){
  var c=S.classe||{};
  return BACS.map(function(b){var it=S.carnet.filter(function(e){return c[e.k]===b.id;});return '<div class="bac '+b.id+'"><strong>'+b.n+'</strong>'+(it.length?'<ul>'+it.map(function(e){return '<li>'+e.t+'</li>';}).join('')+'</ul>':'<span class="sous">rien</span>')+'</div>';}).join('');
}
function rendreEcrit(){
  coquille({illus:'<div class="aide-classement">'+listeClassee()+'</div>',legende:'Ce que tu as classé',rub:'Épilogue',fol:'Ma page',titre:'Une page de ton carnet'});
  monterPages(['<div class="ecrit"><p>Écris ta page à l\'aide de ton classement. Ensuite, copie ton texte et colle-le dans la messagerie du lycée ou dans le devoir de l\'ENT.</p>'+
   '<label for="e1">1. Une chose qui opposait les rives : un lieu, un événement</label><textarea id="e1"></textarea>'+
   '<label for="e2">2. Une chose qui les reliait : culture, économie ou table, avec un exemple précis</label><textarea id="e2"></textarea>'+
   '<label for="e3">3. Ma conclusion : « La Méditerranée de 1148 est un espace de conflits, mais aussi… »</label><textarea id="e3"></textarea>'+
   '<p class="petit" id="copie-retour" aria-live="polite"></p></div>'],
   function(){['e1','e2','e3'].forEach(function(k,i){var t=$(k);if(!t)return;t.value=S.ecrit[i]||'';t.addEventListener('input',function(){S.ecrit[i]=t.value;sauver();});});
     construireChoix($('choix'),[{l:'Copier mon texte',action:copier},{l:'Revenir au bilan',action:function(){aller('bilan');}},{l:'Recommencer le voyage',action:recommencer}]);$('choix').classList.add('trois');});
}
function copier(){
  var txt='Mon carnet de voyage\n\n1. Un conflit : '+(S.ecrit[0]||'')+'\n\n2. Une collaboration : '+(S.ecrit[1]||'')+'\n\n3. Conclusion : La Méditerranée de 1148 est un espace de conflits, mais aussi '+(S.ecrit[2]||'');
  var r=$('copie-retour');
  function secours(){var tmp=document.createElement('textarea');tmp.value=txt;tmp.setAttribute('readonly','');tmp.style.minHeight='6em';tmp.style.width='100%';r.innerHTML='Sélectionne ce texte et copie-le (Ctrl + C) :';r.appendChild(tmp);tmp.focus();tmp.select();}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){r.textContent='Texte copié. Colle-le dans la messagerie du lycée.';},secours);}else secours();}catch(e){secours();}
}
function recommencer(){effacer();nettoyer();S=neuf();carnetNouveau=false;carteNouveau=false;aller('0');}

/* ============ CARNET (sur demande) ============ */
function rosette(p){return '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1l2.2 5.2L17.5 4 15 9.2 19 10l-4 .8 2.5 5.2-5.3-2.2L10 19l-2.2-5.2L2.5 16 5 10.8 1 10l4-.8L2.5 4l5.3 2.2Z" fill="'+(p?'#b0862a':'none')+'" stroke="#2a1c12" stroke-width="1"/></svg>';}
function perle(p){return '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="'+(p?'#22397e':'none')+'" stroke="#2a1c12" stroke-width="1.2"/></svg>';}
function majCarnet(){
  var nk=nourActuelle();$('c-portrait').innerHTML=portrait(nk);$('c-nom').textContent=nk==='nourD'?'Carnet de Nour':'Carnet de Lucia';
  var h='',i;for(i=0;i<5;i++)h+=rosette(i<S.souv);var js=$('j-souvenirs');js.innerHTML=h;js.setAttribute('aria-label',S.souv+' souvenirs sur 5');
  h='';for(i=0;i<5;i++)h+=perle(i<S.conf);var jc=$('j-confiance');jc.innerHTML=h;jc.setAttribute('aria-label','Confiance '+S.conf+' sur 5');
  var b=[];if(S.deniers)b.push(S.deniers+' denier'+(S.deniers>1?'s':''));if(S.hyper)b.push(S.hyper+' hyperpère d\'or');if(S.dirhams)b.push(S.dirhams+' dirhams');
  $('j-bourse').textContent=b.length?b.join(' · '):'vide';
  var sv='';for(i=0;i<5;i++)sv+=i<S.souv?'<li>'+FRAGMENTS[i]+'</li>':'<li class="cache">…</li>';$('c-souvenirs').innerHTML=sv;
  $('objets').innerHTML=S.objets.map(function(o){return '<li>'+o+'</li>';}).join('');
  var bc=$('btn-carnet');bc.innerHTML=ICO.carnet+'Mon carnet'+(carnetNouveau&&$('carnet').hidden?'<span class="nouv" aria-label="nouveau"></span>':'');
}
function majBoutonCarte(){var b=$('btn-carte');b.innerHTML=ICO.plan+'Carte'+(carteNouveau&&$('carte-voyage').hidden?'<span class="nouv" aria-label="nouveau"></span>':'');}
function ouvrirCarte(){fermerOverlays();carteNouveau=false;var c=$('carte-voyage');var v=etapesVues();
  c.innerHTML='<div class="carnet-tete"><div><div class="nom">Carte du voyage</div><div class="sous">'+(v.length?'Les lieux où tu es déjà passée.':'Ton voyage n\'a pas encore commencé.')+'</div></div><button type="button" class="fermer" id="fermer-carte">Fermer</button></div><div class="carte-boite">'+carteVoyage()+'</div>';
  c.hidden=false;$('voile').hidden=false;$('btn-carte').setAttribute('aria-expanded','true');majBoutonCarte();$('fermer-carte').addEventListener('click',fermerOverlays);$('fermer-carte').focus();}
function ouvrirCarnet(){fermerOverlays();carnetNouveau=false;majCarnet();$('carnet').hidden=false;$('voile').hidden=false;$('btn-carnet').setAttribute('aria-expanded','true');$('fermer-carnet').focus();}
function fermerOverlays(){$('carnet').hidden=true;$('boite-doc').hidden=true;$('carte-voyage').hidden=true;$('voile').hidden=true;$('btn-carnet').setAttribute('aria-expanded','false');$('btn-carte').setAttribute('aria-expanded','false');majCarnet();majBoutonCarte();}
function ouvrirDoc(k){
  var d=DOCS[k];if(!d||typeof IMG==='undefined'||!IMG[k])return;fermerOverlays();
  var bd=$('boite-doc');bd.innerHTML='<div class="img-doc"><img src="'+IMG[k]+'" alt="'+d.t.replace(/"/g,'')+'"></div><div class="pied-doc"><div><b>'+d.t+'.</b> '+d.x+'<span class="credit">Domaine public · Wikimedia Commons</span></div><button type="button" class="fermer" id="fermer-doc">Fermer</button></div>';
  bd.hidden=false;$('voile').hidden=false;$('fermer-doc').addEventListener('click',fermerOverlays);$('fermer-doc').focus();
}

/* ============ DÉFINITIONS EN BULLE ============ */
var motOuvert=null;
function fermerBulle(){var b=$('bulle-def');if(b)b.hidden=true;if(motOuvert)motOuvert.setAttribute('aria-expanded','false');motOuvert=null;}
function ouvrirBulle(m){
  if(motOuvert===m){fermerBulle();return;}fermerBulle();
  var b=$('bulle-def'),k=m.getAttribute('data-mot');b.innerHTML='<b>'+m.textContent+'</b> : '+(MOTS[k]||'');b.hidden=false;
  var r=m.getBoundingClientRect(),w=b.offsetWidth,hh=b.offsetHeight;
  var x=Math.max(8,Math.min(r.left,window.innerWidth-w-8)),y=r.bottom+6;if(y+hh>window.innerHeight-8)y=Math.max(8,r.top-hh-6);
  b.style.left=x+'px';b.style.top=y+'px';m.setAttribute('aria-expanded','true');motOuvert=m;
}

/* ============ VOIX ============ */
var voixActive=false;
function stopVoix(){try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}voixActive=false;}
function brancherVoix(){
  var b=$('btn-voix');if(!b)return;
  b.addEventListener('click',function(){
    if(voixActive){stopVoix();b.setAttribute('aria-pressed','false');b.textContent='🔊 Écouter';return;}
    var parts=[];var t=document.querySelector('#folio h2');if(t&&PAGE===0)parts.push(t.textContent);
    document.querySelectorAll('#page-texte > p, #page-texte .dialogue, #page-texte .encart li, #page-texte .annonce, #page-texte .fiche, #zone-jeu .consigne').forEach(function(n){
      if(n.classList.contains('dialogue')){parts.push(n.querySelector('.qui').textContent+' : '+n.querySelector('.dit').textContent);return;}
      var c=n.cloneNode(true);c.querySelectorAll('svg').forEach(function(x){x.remove();});parts.push(c.textContent);});
    var u=new SpeechSynthesisUtterance(parts.join('. '));u.lang='fr-FR';u.rate=0.95;
    try{var vs=speechSynthesis.getVoices().filter(function(v){return /^fr/i.test(v.lang);});if(vs.length)u.voice=vs[0];}catch(e){}
    u.onend=function(){voixActive=false;b.setAttribute('aria-pressed','false');b.textContent='🔊 Écouter';};
    voixActive=true;b.setAttribute('aria-pressed','true');b.textContent='■ Arrêter';
    try{speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){voixActive=false;}
  });
}

/* ============ ÉVÉNEMENTS ============ */
$('folio').addEventListener('click',function(e){
  var m=e.target.closest('.mot');if(m){e.stopPropagation();ouvrirBulle(m);return;}
  if(e.target.closest('.ouvrir-carte')){ouvrirCarte();return;}
  var g=e.target.closest('[data-go]');if(g&&g.classList.contains('lieu-plan')){aller(g.getAttribute('data-go'));return;}
  var vd=e.target.closest('.vignette-doc');if(vd){ouvrirDoc(vd.getAttribute('data-doc'));return;}
  var bp=e.target.closest('.btn-page');if(bp&&!bp.disabled){tourner(+bp.getAttribute('data-p'));return;}
});
document.addEventListener('click',function(e){if(motOuvert&&!e.target.closest('.mot')&&!e.target.closest('#bulle-def'))fermerBulle();});
$('folio').addEventListener('keydown',function(e){var g=e.target.closest&&e.target.closest('.lieu-plan');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();aller(g.getAttribute('data-go'));}});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){fermerBulle();fermerOverlays();return;}
  if(MODEJEU||!$('carnet').hidden||!$('boite-doc').hidden||!$('carte-voyage').hidden)return;
  var tag=(e.target&&e.target.tagName)||'';if(tag==='TEXTAREA'||tag==='INPUT')return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){if(PAGE<PAGES.length-1){e.preventDefault();tourner(1);}}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){if(PAGE>0){e.preventDefault();tourner(-1);}}
});
$('folio').addEventListener('mousemove',function(e){
  if(calme())return;var bm=e.target.closest('.boite-mini');if(!bm)return;
  var r=bm.getBoundingClientRect(),dx=(e.clientX-r.left)/r.width-0.5,dy=(e.clientY-r.top)/r.height-0.5;
  var d=bm.querySelector('.pl-decor'),a=bm.querySelector('.pl-avant');
  if(d)d.style.transform='translate('+(-dx*8).toFixed(1)+'px,'+(-dy*5).toFixed(1)+'px)';
  if(a)a.style.transform='translate('+(-dx*18).toFixed(1)+'px,'+(-dy*10).toFixed(1)+'px)';
});
$('folio').addEventListener('mouseleave',function(){document.querySelectorAll('.pl').forEach(function(p){p.style.transform='';});});
var minuteurTaille=null,tailleAvant=window.innerWidth+'x'+window.innerHeight;
window.addEventListener('resize',function(){
  clearTimeout(minuteurTaille);
  minuteurTaille=setTimeout(function(){var t=window.innerWidth+'x'+window.innerHeight;if(t===tailleAvant)return;tailleAvant=t;fermerBulle();if(!MODEJEU)rendre();},180);
});

$('btn-carnet').addEventListener('click',function(){if($('carnet').hidden)ouvrirCarnet();else fermerOverlays();});
$('btn-carte').addEventListener('click',function(){if($('carte-voyage').hidden)ouvrirCarte();else fermerOverlays();});
$('fermer-carnet').addEventListener('click',fermerOverlays);
$('voile').addEventListener('click',fermerOverlays);
function majBoutons(){
  var bm=$('btn-musique');bm.setAttribute('aria-pressed',PREF.musique?'true':'false');bm.textContent='♪ Musique : '+(PREF.musique?'oui':'non');
  $('btn-lecture').setAttribute('aria-pressed',PREF.lecture?'true':'false');
  document.body.classList.toggle('lecture',PREF.lecture);
}
$('btn-musique').addEventListener('click',function(){
  PREF.musique=!PREF.musique;ecrireStock(CLE_PREF,PREF);majBoutons();
  if(!M.ac){if(PREF.musique&&S.scene!=='titre'&&initSon()){M.ac.resume();musique(M.voulu||'mer');}return;}
  if(PREF.musique){M.ac.resume().then(function(){musique(M.voulu);});}else{M.ac.suspend();}
});
$('btn-lecture').addEventListener('click',function(){PREF.lecture=!PREF.lecture;ecrireStock(CLE_PREF,PREF);majBoutons();if(!MODEJEU){PAGE=0;rendre();}});
$('btn-ecran').addEventListener('click',function(){
  try{var d=document;if(d.fullscreenElement){if(d.exitFullscreen)d.exitFullscreen().catch(function(){});}
    else{var p=d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen();if(p&&p.catch)p.catch(function(){});}}catch(e){}
});

function fixerHauteur(){try{document.documentElement.style.setProperty('--h',window.innerHeight+'px');}catch(e){}}
fixerHauteur();window.addEventListener('resize',fixerHauteur);window.addEventListener('orientationchange',function(){setTimeout(fixerHauteur,300);});
/* Déverrouillage du son : Safari exige que le son démarre pendant un geste de l'élève */
['pointerdown','touchend','keydown','click'].forEach(function(t){document.addEventListener(t,deverrouillerSon,true);});
majBoutons();
rendre();

}catch(err){erreurVisible((err&&err.stack)||err);}})();
</script>
