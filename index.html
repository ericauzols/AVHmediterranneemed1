<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>D'une rive à l'autre</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Reem+Kufi:wght@500;700&family=Uncial+Antiqua&display=swap">
<style>
/* Mise en page : un manuscrit ouvert qui tient sur un écran en largeur, sans défilement.
   Image (miniature ou plan) à gauche, texte paginé à droite ; carnet de Nour sur demande.
   Univers unique et volontaire (parchemin, encres, or) : pas de thème sombre ; un mode lecture pour la lisibilité. */
:root{
  --cuir:#3b2a1e;
  --cuir-clair:#5a4130;
  --parchemin:#ecdcb8;
  --parchemin-ombre:#d6bd8a;
  --encre:#2a1c12;
  --encre-douce:#5b4632;
  --vermillon:#a3301c;
  --lapis:#22397e;
  --or:#b0862a;
  --or-clair:#e6c86e;
  --malachite:#2f6247;
  --soie:#f4ead2;
  --r-panneau:18px;
  --r-bouton:12px;
  --r-pastille:999px;
  --f-titre:'Uncial Antiqua','Palatino Linotype','Book Antiqua',serif;
  --f-texte:'EB Garamond',Garamond,'Times New Roman',Georgia,serif;
  --f-arabe:'Reem Kufi','Amiri','Noto Naskh Arabic','Arial',sans-serif;
  --taille:clamp(15px,2.45vh,19px);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%;background:var(--cuir);color:var(--encre)}
body{
  margin:0;overflow:hidden;
  font-family:var(--f-texte);font-size:var(--taille);line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
  background:radial-gradient(ellipse at 50% 0%, var(--cuir-clair), transparent 70%), var(--cuir);
}
button{font-family:var(--f-texte);font-size:inherit}
.app{height:var(--h,100vh);min-height:480px;max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:8px}

/* Bandeau */
.bandeau{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;color:var(--or-clair)}
.bandeau .titre{font-family:var(--f-titre);font-weight:400;font-size:1.35rem;letter-spacing:.02em;line-height:1.1;margin:0}
.bandeau-droite{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn-ecran{position:relative;font-size:.86rem;color:var(--or-clair);background:transparent;border:1px solid var(--or);padding:5px 12px;border-radius:var(--r-pastille);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-ecran:hover{background:rgba(230,200,110,.14)}
.btn-ecran[aria-pressed="true"]{background:rgba(230,200,110,.22)}
.btn-ecran svg{width:18px;height:18px}
.btn-carnet{background:var(--or-clair);color:var(--encre);border-color:var(--or)}
.btn-carnet:hover{background:#f0d98a}
.btn-carnet .nouv{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--vermillon);border:2px solid var(--soie)}

/* Scène */
.parchemin{
  position:relative;background-color:var(--parchemin);
  background-image:
    radial-gradient(ellipse at center, transparent 55%, rgba(120,80,30,.22) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .15  0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 0 0 1px rgba(90,60,30,.35);
  border-radius:var(--r-panneau);
}
.folio{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.folio::before{content:"";position:absolute;inset:10px;border:1px solid var(--vermillon);outline:1px solid rgba(34,57,126,.55);outline-offset:-5px;border-radius:12px;pointer-events:none}
.scene{flex:1 1 auto;min-height:0;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,46fr) minmax(0,54fr);gap:clamp(14px,2.2vw,30px);padding:clamp(18px,3vh,30px) clamp(20px,2.6vw,36px)}
.scene.plein{grid-template-columns:minmax(0,1fr)}
.col-illus{min-height:0;display:flex;flex-direction:column;justify-content:center;gap:8px}
.illus{flex:0 1 auto;min-height:0;position:relative}
.illus>.boite-mini,.illus>.plan-boite{display:block;width:100%}
.illus svg.miniature,.illus svg.plan-svg{display:block;width:100%;height:auto;max-height:calc(var(--h,100vh) - 230px);margin:0 auto}
.col-illus.avec-doc svg.miniature,.col-illus.avec-doc svg.plan-svg{max-height:calc(var(--h,100vh) - 250px - 16vh)}
.illus>.aide-classement{width:100%;max-height:calc(var(--h,100vh) - 200px)}
.illus>.aide-classement{width:100%}
.legende{flex:none;font-family:var(--f-titre);color:var(--vermillon);text-align:center;font-size:.86rem;letter-spacing:.05em;margin:0}
.vignette-doc{flex:none;display:flex;gap:12px;align-items:center;height:clamp(78px,16vh,140px);padding:6px;text-align:left;border:1px solid var(--parchemin-ombre);border-radius:14px;background:rgba(255,250,235,.55);cursor:zoom-in;color:var(--encre)}
.vignette-doc:hover{background:rgba(255,250,235,.9);border-color:var(--or)}
.vignette-doc img{height:100%;width:auto;max-width:48%;object-fit:cover;border-radius:10px;flex:none}
.vignette-doc span{font-size:.84rem;line-height:1.3;min-width:0}
.vignette-doc b{display:block;color:var(--vermillon);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.vignette-doc .petit{display:block;margin-top:2px}

.col-texte{min-height:0;display:flex;flex-direction:column;gap:6px}
.rubrique-haut{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--vermillon)}
.rubrique-haut .droite{display:flex;align-items:center;gap:10px}
.rubrique-haut .fol{font-family:var(--f-titre);letter-spacing:.04em;text-transform:none;font-size:.95rem;color:var(--lapis);white-space:nowrap}
.btn-voix{font-size:.8rem;letter-spacing:0;text-transform:none;color:var(--lapis);background:rgba(255,250,235,.6);border:1px solid var(--lapis);border-radius:var(--r-pastille);padding:2px 12px;cursor:pointer}
.btn-voix[aria-pressed="true"]{background:var(--lapis);color:var(--soie)}
h2.lieu{flex:none;font-family:var(--f-titre);font-weight:400;color:var(--vermillon);font-size:1.32rem;line-height:1.2;margin:0;text-wrap:balance}
.page-texte{flex:1;min-height:0;overflow:auto;padding-right:4px}
.page-texte>*:last-child{margin-bottom:0}
.page-texte p{margin:0 0 .7em}
.pied-page{flex:none;display:flex;flex-direction:column;gap:8px}
.lettrine-p::first-line{font-variant:small-caps;letter-spacing:.03em}
.lettrine{float:left;width:3.4em;height:3.4em;margin:4px 10px 0 0}
.parole{font-style:italic;color:var(--lapis)}
.nouveau{animation:apparait .6s ease-out}
@keyframes apparait{from{opacity:.25;transform:translateY(4px)}to{opacity:1;transform:none}}

.nav-page{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn-page{font-size:.92rem;color:var(--lapis);background:none;border:none;cursor:pointer;padding:6px 4px;text-decoration:underline}
.btn-page:disabled{visibility:hidden}
.btn-suite{font-size:1rem;color:var(--encre);background:var(--or-clair);border:1px solid var(--or);border-radius:var(--r-pastille);padding:7px 20px;cursor:pointer}
.btn-suite:hover{background:#f0d98a}
.num-page{font-size:.82rem;color:var(--encre-douce);font-style:italic}

/* Dialogues */
.dialogue{display:flex;gap:10px;align-items:flex-start;margin:0 0 .7em;clear:both}
.dialogue .portrait{width:3.4em;height:3.4em;flex:none}
.dialogue .bulle{flex:1;min-width:0;background:rgba(255,250,235,.62);border:1px solid var(--parchemin-ombre);border-radius:4px 14px 14px 14px;padding:6px 12px}
.dialogue .qui{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--vermillon)}
.dialogue .dit{margin:0;color:var(--lapis);font-style:italic}
.dialogue.nour .bulle{background:rgba(230,200,110,.22);border-color:var(--or)}

/* Mots expliqués */
.mot{font:inherit;color:var(--lapis);background:none;border:none;border-bottom:2px dotted var(--lapis);padding:0;cursor:help;line-height:inherit}
.mot[aria-expanded="true"]{background:rgba(34,57,126,.1);border-bottom-style:solid}
.bulle-def{position:fixed;z-index:40;max-width:min(340px,86vw);background:var(--soie);color:var(--encre);border:2px solid var(--lapis);border-radius:14px;padding:8px 12px;font-size:.92rem;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.bulle-def b{color:var(--lapis)}

/* Annonces, encarts */
.annonces{display:grid;gap:6px;margin:0 0 .7em}
.annonce{display:flex;gap:10px;align-items:center;padding:6px 12px;border-radius:12px;border:1px solid var(--or);background:rgba(230,200,110,.28);font-size:.92rem;line-height:1.35}
.annonce svg{width:22px;height:22px;flex:none}
.annonce.baisse{border-color:var(--vermillon);background:rgba(163,48,28,.1)}
.encart{margin:0 0 .7em;padding:10px 16px;border:1px solid var(--lapis);background:rgba(34,57,126,.07);border-radius:14px;font-size:.94rem}
.encart h3{font-family:var(--f-titre);font-weight:400;color:var(--lapis);font-size:1.05rem;margin:0 0 4px}
.encart ul{margin:0;padding-left:20px;display:grid;gap:3px}

/* Plans */
.plan-svg{display:block;width:100%;height:100%}
.lieu-plan{cursor:pointer;outline:none}
.lieu-plan:hover .pastille-plan,.lieu-plan:focus-visible .pastille-plan{stroke:#e6c86e;stroke-width:4}
.lieu-plan.vu .pastille-plan{fill:#2f6247}

.choix{display:grid;gap:7px}
.choix.deux{grid-template-columns:repeat(2,minmax(0,1fr))}
.choix button{
  display:flex;align-items:center;gap:10px;text-align:left;width:100%;
  font-size:.96rem;line-height:1.3;color:var(--encre);
  background:rgba(255,250,235,.5);border:1px solid var(--encre-douce);border-left:6px solid var(--lapis);
  padding:7px 14px;border-radius:var(--r-bouton);cursor:pointer;transition:background .2s,border-color .2s;
}
.choix button:hover:not(:disabled){background:rgba(255,250,235,.9);border-left-color:var(--vermillon)}
.choix button:disabled{opacity:.55;cursor:not-allowed}
.choix .fleche{font-family:var(--f-titre);color:var(--vermillon);font-size:1.1rem;flex:none}
.choix .renvoi{margin-left:auto;font-size:.8rem;color:var(--encre-douce);font-style:italic;flex:none;text-align:right}
.choix .btn-jeu{border-left-color:var(--or);background:rgba(230,200,110,.35)}
button:focus-visible,.lieu-plan:focus-visible{outline:2px solid var(--vermillon);outline-offset:2px}

/* Écran titre et guide */
.titre-jeu{font-family:var(--f-titre);font-weight:400;color:var(--vermillon);font-size:2rem;line-height:1.1;margin:0 0 .4em;text-wrap:balance}
.petit{font-size:.88rem;color:var(--encre-douce);font-style:italic}
.guide{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fiche{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--parchemin-ombre);border-radius:14px;background:rgba(255,250,235,.55)}
.fiche svg{width:2.2em;height:2.2em;flex:none}
.fiche h3{font-family:var(--f-titre);font-weight:400;color:var(--lapis);font-size:.98rem;margin:0 0 2px}
.fiche p{margin:0;font-size:.86rem;line-height:1.35}

/* Overlays */
.voile{position:fixed;inset:0;z-index:20;background:rgba(20,12,6,.55)}
.carnet-panneau{position:fixed;z-index:30;top:max(10px,env(safe-area-inset-top,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));right:max(10px,env(safe-area-inset-right,0px));width:min(360px,calc(100vw - 20px));overflow:auto;padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px;animation:glisse .3s ease-out}
@keyframes glisse{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
.carnet-panneau h3{font-family:var(--f-titre);font-weight:400;font-size:1.05rem;color:var(--lapis);margin:0 0 6px;border-bottom:1px solid var(--parchemin-ombre);padding-bottom:4px}
.carnet-tete{display:flex;gap:12px;align-items:center}
.carnet-tete .portrait{width:60px;height:60px;flex:none}
.carnet-tete .nom{font-family:var(--f-titre);color:var(--vermillon);font-size:1.1rem;line-height:1.1}
.carnet-tete .sous{font-size:.84rem;font-style:italic;color:var(--encre-douce)}
.fermer{margin-left:auto;align-self:flex-start;font-size:.86rem;color:var(--encre);background:var(--soie);border:1px solid var(--encre-douce);border-radius:var(--r-pastille);padding:4px 12px;cursor:pointer}
.jauge{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 0}
.jauge .nom-j{font-size:.92rem}
.jauge .val{display:flex;gap:4px}
.jauge svg{width:20px;height:20px}
.bourse{font-variant-numeric:tabular-nums;font-size:.9rem;text-align:right}
.souvenirs-liste{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.souvenirs-liste li{font-size:.9rem;font-style:italic;line-height:1.35;padding-left:18px;position:relative}
.souvenirs-liste li::before{content:"✦";position:absolute;left:0;color:var(--or)}
.souvenirs-liste li.cache{font-style:normal;color:var(--encre-douce);opacity:.7}
.objets{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.objets li{font-size:.84rem;border:1px solid var(--or);background:rgba(230,200,110,.2);padding:2px 10px;border-radius:var(--r-pastille)}
.boite-doc{position:fixed;z-index:30;inset:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r-panneau)}
.boite-doc .img-doc{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--encre);border-radius:12px;overflow:hidden}
.boite-doc .img-doc img{max-width:100%;max-height:100%;object-fit:contain}
.boite-doc .pied-doc{flex:none;display:flex;gap:14px;align-items:flex-start;font-size:.92rem;line-height:1.4}
.boite-doc .pied-doc b{color:var(--vermillon)}
.boite-doc .credit{display:block;font-size:.78rem;color:var(--encre-douce);margin-top:2px}
.tourner{display:none}

/* Mini-jeux */
.zone-jeu{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start}
.jeu{width:100%;max-width:1040px;padding:12px 18px;border:1px solid var(--encre-douce);border-radius:18px;background:rgba(255,250,235,.55)}
.jeu h3{font-family:var(--f-titre);font-weight:400;color:var(--lapis);font-size:1.2rem;margin:0 0 2px}
.jeu .consigne{margin:0 0 10px;font-size:.95rem}
.jeu .retour{min-height:1.4em;margin:8px 0 0;font-style:italic;color:var(--encre-douce)}
.jeu .retour.ok{color:var(--malachite);font-style:normal;font-weight:600}
.jeu .retour.ko{color:var(--vermillon)}
.jeu-pied{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.lien-passer{background:none;border:none;color:var(--encre-douce);text-decoration:underline;cursor:pointer;font-size:.86rem;padding:4px}
.btn-or{font-size:.96rem;color:var(--encre);background:var(--or-clair);border:1px solid var(--or);border-radius:var(--r-pastille);padding:7px 18px;cursor:pointer}
.btn-or:hover{background:#f0d98a}
.btn-or:disabled{opacity:.5;cursor:not-allowed}
.secoue{animation:secoue .35s}
@keyframes secoue{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.jetons{display:flex;flex-wrap:wrap;gap:7px}
.jeton{font-size:.94rem;border:1px solid var(--encre-douce);background:var(--soie);border-radius:var(--r-pastille);padding:5px 14px;cursor:pointer;color:var(--encre)}
.jeton[aria-pressed="true"]{border-color:var(--lapis);box-shadow:0 0 0 2px var(--lapis)}
.jeton.place{background:var(--or-clair);border-color:var(--or);cursor:default}
.zones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.zone{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:96px;text-align:left;border:1px dashed var(--encre-douce);border-radius:16px;padding:10px 12px;background:rgba(255,250,235,.6);cursor:pointer;color:var(--encre)}
.zone strong{font-family:var(--f-titre);font-weight:400;color:var(--vermillon);font-size:1rem}
.zone .sous{font-size:.82rem;color:var(--encre-douce)}
.zone .dedans{display:flex;flex-wrap:wrap;gap:4px}
.zone .dedans span{font-size:.8rem;background:var(--or-clair);border-radius:var(--r-pastille);padding:1px 8px}
.venise-centre{grid-column:1/-1;text-align:center;font-family:var(--f-titre);color:var(--lapis);font-size:.92rem}

.bande-tiraz{direction:rtl;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px 10px;background:var(--soie);border-top:5px double var(--vermillon);border-bottom:5px double var(--vermillon);border-radius:14px;margin-bottom:10px}
.mot-ar{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent;border-radius:12px;padding:4px 10px;background:none;cursor:pointer;color:var(--vermillon)}
.mot-ar .ar{font-family:var(--f-arabe);font-weight:700;font-size:1.5rem;line-height:1.6}
.mot-ar .tr{direction:ltr;font-size:.8rem;color:var(--encre-douce);font-style:italic}
.mot-ar[aria-pressed="true"]{border-color:var(--lapis);background:rgba(34,57,126,.08)}
.mot-ar.place{color:var(--or);cursor:default}
.mot-ar.place .ar{text-shadow:0 0 1px var(--encre)}

.labyrinthe-zone{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center}
.labyrinthe{display:grid;width:min(360px,calc(100vh - 290px));min-width:220px;aspect-ratio:1;max-width:100%;border:3px solid var(--encre);border-radius:12px;overflow:hidden;background:var(--cuir)}
.case{position:relative;border-color:var(--encre);border-style:solid;border-width:0;background:var(--cuir)}
.case.vu{background:#cdb788}
.case.proche{background:var(--parchemin)}
.case .pion,.case .port{position:absolute;inset:18%;border-radius:50%}
.case .pion{background:var(--vermillon);box-shadow:0 0 0 2px var(--soie)}
.case .port{background:var(--or-clair);border-radius:4px;box-shadow:0 0 10px 3px rgba(230,200,110,.8)}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px}
.pad button{border:1px solid var(--encre-douce);border-radius:12px;background:var(--soie);font-size:1.2rem;cursor:pointer;color:var(--encre)}
.chrono{font-family:var(--f-titre);font-size:1.25rem;color:var(--vermillon);font-variant-numeric:tabular-nums;margin:0 0 8px}

.balance-svg{display:block;width:100%;max-width:400px;max-height:calc(100vh - 470px);min-height:140px;height:auto;margin:0 auto}
.pieces-rangee{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:4px 0 8px}
.piece{width:50px;height:50px;border-radius:50%;border:2px solid var(--or);background:radial-gradient(circle at 35% 30%,#f6e39b,#c99b35 70%,#8f6a1c);font-family:var(--f-titre);font-size:1.1rem;color:var(--encre);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.piece small{font-family:var(--f-texte);font-size:.55rem}
.pesees{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.journal{margin:8px auto 0;padding-left:20px;font-size:.92rem;max-width:620px}
.accuse{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:10px}

.etapes-moulin{display:grid;gap:7px;max-width:620px;margin:0 auto}
.etape-btn{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--encre-douce);border-radius:14px;background:var(--soie);padding:7px 12px;cursor:pointer;font-size:.98rem;color:var(--encre)}
.etape-btn .num{width:28px;height:28px;flex:none;border-radius:50%;border:1px solid var(--encre-douce);display:flex;align-items:center;justify-content:center;font-family:var(--f-titre);color:var(--vermillon)}
.etape-btn.fait{background:var(--or-clair);cursor:default}

.cartes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.carte{height:clamp(70px,14vh,96px);border-radius:14px;border:1px solid var(--encre-douce);cursor:pointer;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--encre)}
.carte.dos{background:var(--lapis) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><path d='M10 0L20 10L10 20L0 10Z' fill='none' stroke='%23e6c86e' stroke-width='1' opacity='.6'/></svg>")}
.carte.face{background:var(--soie)}
.carte.trouvee{background:var(--or-clair);border-color:var(--or);cursor:default}
.carte .fr{font-family:var(--f-titre);font-size:1rem;color:var(--vermillon)}
.carte .ar{font-family:var(--f-arabe);font-weight:700;font-size:1.3rem;color:var(--lapis);line-height:1.3}
.carte .tr{font-size:.76rem;font-style:italic;color:var(--encre-douce)}

.carte-orient{position:relative;margin:10px auto 0;width:min(100%,calc((100vh - 300px)*2.13))}
.carte-orient svg{display:block;width:100%;height:auto;border-radius:16px}
.ville-btn{position:absolute;transform:translate(-50%,-50%);font-size:.84rem;border:2px solid var(--vermillon);background:var(--soie);color:var(--encre);border-radius:var(--r-pastille);padding:2px 10px;cursor:pointer;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.ville-btn .dedans{display:block;font-size:.74rem;color:var(--malachite);font-weight:600}
.ville-btn.pleine{border-color:var(--malachite)}

.souvenirs-choix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.souv-carte{min-height:72px;border-radius:14px;border:1px solid var(--encre-douce);background:var(--soie);cursor:pointer;padding:8px;font-size:.96rem;color:var(--encre);text-align:center}
.souv-carte[aria-pressed="true"]{background:var(--or-clair);border-color:var(--or);box-shadow:0 0 0 2px var(--or)}

.pirates-zone{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:center}
.pirates-canvas{height:min(440px,calc(100vh - 260px));min-height:240px;width:auto;aspect-ratio:360/440;max-width:100%;border-radius:16px;border:2px solid var(--encre);background:#22397e;touch-action:none}
.jauges-course{flex:1;min-width:200px;max-width:340px;display:grid;gap:10px}
.barre{height:14px;border-radius:999px;background:rgba(42,28,18,.15);overflow:hidden}
.barre span{display:block;height:100%;border-radius:999px}
.barre.rhodes span{background:var(--malachite)}
.barre.corsaires span{background:var(--vermillon)}
.pad2{display:flex;gap:8px}
.pad2 button{flex:1;min-height:52px;border:1px solid var(--encre-douce);border-radius:14px;background:var(--soie);font-size:1.3rem;cursor:pointer;color:var(--encre)}

/* Échecs */
.echecs-zone{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center}
.echiquier{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:min(360px,calc(100vh - 280px));min-width:220px;aspect-ratio:1;border:4px solid #7a5530;border-radius:8px;overflow:hidden}
.echiquier button{min-width:0;min-height:0;overflow:hidden;border:none;padding:0;margin:0;font-size:calc(min(360px,100vh - 280px) / 10);line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--encre);font-family:'Segoe UI Symbol','DejaVu Sans','Noto Sans Symbols 2',serif}
.echiquier .cl{background:#ecdcb8}
.echiquier .fo{background:#a88d60}
.echiquier .sel{box-shadow:inset 0 0 0 4px var(--lapis)}
.echiquier .blanc{color:#fffdf6;text-shadow:0 0 1px #2a1c12,0 0 1px #2a1c12,0 0 2px #2a1c12,1px 1px 0 #2a1c12}
.echecs-aide{max-width:360px;font-size:.92rem}
.echecs-aide ul{margin:6px 0 0;padding-left:20px}

/* Classement final */
.classement{display:grid;gap:12px}
.a-classer{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.chose{max-width:640px;padding:12px 20px;border:2px solid var(--or);border-radius:16px;background:var(--soie);font-size:1.05rem;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.compteur{font-size:.86rem;color:var(--encre-douce);font-style:italic}
.bacs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.bac{display:flex;flex-direction:column;gap:4px;text-align:left;min-height:120px;max-height:calc(100vh - 380px);overflow:auto;border:2px dashed var(--encre-douce);border-radius:16px;padding:10px 12px;background:rgba(255,250,235,.6);cursor:pointer;color:var(--encre)}
.bac:hover{border-style:solid;background:rgba(255,250,235,.95)}
.bac strong{font-family:var(--f-titre);font-weight:400;font-size:1rem}
.bac.conflit strong{color:var(--vermillon)}
.bac.eco strong,.bac.culture strong,.bac.gastro strong{color:var(--malachite)}
.bac .sous{font-size:.8rem;color:var(--encre-douce)}
.bac ul{margin:4px 0 0;padding-left:16px;font-size:.8rem;line-height:1.3;display:grid;gap:2px}
.aide-classement{height:100%;overflow:auto;display:grid;gap:10px;align-content:start}
.aide-classement .bac{max-height:none;cursor:default}

.ecrit label{display:block;font-weight:600;margin:6px 0 2px;font-size:.9rem}
.choix.trois{grid-template-columns:repeat(3,minmax(0,1fr))}
.ecrit p{margin:0 0 .3em}
.ecrit textarea{width:100%;min-height:2.7em;border:1px solid var(--encre-douce);border-radius:12px;padding:8px 12px;font-family:var(--f-texte);font-size:.98rem;background:rgba(255,250,235,.8);color:var(--encre);resize:vertical}

/* Animations des miniatures */
.pl{transition:transform .25s ease-out}
.a-tangue{animation:tangue 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
@keyframes tangue{0%,100%{transform:rotate(-1.6deg) translateY(0)}50%{transform:rotate(1.6deg) translateY(2px)}}
.a-vague{animation:vague 6s ease-in-out infinite}
@keyframes vague{50%{transform:translateX(-14px)}}
.a-voile{animation:voile 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes voile{50%{transform:scaleX(1.07)}}
.a-fanion{animation:fanion 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes fanion{50%{transform:scaleY(.55) skewY(8deg)}}
.a-flamme{animation:flamme .6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flamme{to{transform:scaleY(1.28) scaleX(.88)}}
.a-lampe{animation:lampe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes lampe{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.a-foule{animation:foule 2.4s ease-in-out infinite}
@keyframes foule{50%{transform:translateY(-2px)}}
.a-marteau{animation:marteau .9s ease-in-out infinite;transform-box:fill-box;transform-origin:10% 90%}
@keyframes marteau{50%{transform:rotate(-28deg)}}
.a-oiseau{animation:oiseau 16s linear infinite}
@keyframes oiseau{from{transform:translateX(-120px)}to{transform:translateX(760px)}}
.a-lueur{animation:lueur 1.8s ease-in-out infinite alternate}
@keyframes lueur{to{opacity:.5}}
.a-approche{animation:approche 7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes approche{to{transform:translateX(-34px) scale(1.05)}}

/* Mode lecture */
body.lecture{--f-texte:'Atkinson Hyperlegible',Verdana,Tahoma,Arial,sans-serif;--f-titre:'Atkinson Hyperlegible',Verdana,Tahoma,Arial,sans-serif;--taille:clamp(16px,2.7vh,21px);line-height:1.7;letter-spacing:.03em;word-spacing:.12em}
body.lecture .parchemin{background-image:none;background-color:#f7f0df}
body.lecture .parole,body.lecture .dialogue .dit,body.lecture em,body.lecture .petit,body.lecture .souvenirs-liste li{font-style:normal}
body.lecture h2.lieu{font-weight:700}
body.lecture .legende{font-weight:700}
body.lecture *,body.lecture *::before,body.lecture *::after{animation:none!important;transition:none!important}

/* Écrans étroits ou trop bas : on revient à une page qui défile */
@media (max-width:899px),(max-height:479px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .folio{flex:none}
  .scene{flex:none;grid-template-rows:auto;grid-template-columns:minmax(0,1fr)}
  .illus{flex:none}
  .illus svg.miniature,.illus svg.plan-svg,.col-illus.avec-doc svg.miniature,.col-illus.avec-doc svg.plan-svg{max-height:34vh}
  .page-texte{flex:none;overflow:visible}
  .zone-jeu{overflow:visible}
  .guide,.zones,.bacs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cartes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bac{max-height:none}
}
@media (orientation:portrait) and (max-width:899px){
  .tourner{display:block;flex:none;text-align:center;font-size:.9rem;color:var(--encre);background:var(--or-clair);border-radius:12px;padding:6px 12px}
}
@media (max-width:560px){
  .guide,.zones,.bacs,.choix.deux,.souvenirs-choix{grid-template-columns:minmax(0,1fr)}
  .titre-jeu{font-size:1.6rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
.echiquier svg{width:88%;height:88%;display:block}
.carte-panneau{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);width:min(920px,calc(100vw - 24px));max-height:calc(var(--h,100vh) - 24px);overflow:auto;padding:14px 18px 16px;display:flex;flex-direction:column;gap:8px}
.carte-boite{min-height:0;display:flex;justify-content:center}
.carte-svg{display:block;width:100%;height:auto;max-height:calc(var(--h,100vh) - 120px);border-radius:14px;border:2px solid var(--encre)}
.lien-carte{font:inherit;font-size:.86rem;color:var(--lapis);background:var(--soie);border:1px solid var(--lapis);border-radius:999px;padding:1px 10px;margin-left:4px;cursor:pointer}

/* ============ EFFETS ET ANNONCES ============ */
function note(type,k,t,d){for(var i=0;i<S.carnet.length;i++){if(S.carnet[i].k===k)return;}S.carnet.push({k:k,type:type,t:t,d:d||''});recents.push(k);}
function annonce(txt,genre){annonces.push({t:txt,g:genre||'info'});}
function souv(n){
  var avant=S.souv;S.souv=Math.max(0,Math.min(5,S.souv+n));pulseS=true;
  for(var i=avant;i<S.souv;i++)annonce('Un souvenir revient : <em>'+FRAGMENTS[i]+'</em>','souv');
  carnetNouveau=true;
}
function conf(n,msg){
  var avant=S.conf;S.conf=Math.max(0,Math.min(5,S.conf+n));pulseC=true;
  if(msg)annonce(msg,n<0?'baisse':'conf');
  carnetNouveau=true;
}
function bourse(msg,baisse){annonce(msg,baisse?'baisse':'bourse');carnetNouveau=true;}
function objet(o){if(S.objets.indexOf(o)<0){S.objets.push(o);carnetNouveau=true;}}
function remplace(a,b){var i=S.objets.indexOf(a);if(i>=0)S.objets[i]=b;else objet(b);}
function nbVus(l){return l.filter(function(i){return S.vus[i];}).length;}
function a(o){return S.objets.indexOf(o)>=0;}

/* ============ UTILITAIRES ============ */
function romain(n){var t=[[10,'x'],[9,'ix'],[5,'v'],[4,'iv'],[1,'i']],r='';t.forEach(function(p){while(n>=p[0]){r+=p[1];n-=p[0];}});return r;}
function melange(arr){var b=arr.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=b[i];b[i]=b[j];b[j]=x;}return b;}
function val(x){return typeof x==='function'?x():x;}

function monterJeu(el,titre,consigne,fin){

  var p=[{a:'بركة من الله',tr:'baraka min Allâh',f:'Bénédiction de Dieu'},{a:'لصاحبه',tr:'li-sâhibihi',f:'à celui qui le possède'},{a:'عمل بطراز',tr:'\'umila bi-tirâz',f:'tissé dans l\'atelier'},{a:'بيت راشد',tr:'bayt Râshid',f:'de la maison de Rashid'},{a:'بدمشق',tr:'bi-Dimashq',f:'à Damas'}];

  function dessiner(){
    var h='<div class="bande-tiraz" lang="ar">';p.forEach(function(x,i){h+='<button type="button" class="mot-ar'+(ok[i]?' place':'')+'" data-a="'+i+'" aria-pressed="'+(sel===i)+'"'+(ok[i]?' disabled':'')+'><span class="ar">'+x.a+'</span><span class="tr">'+x.tr+'</span></button>';});
    h+='</div><div class="jetons">';ordreF.forEach(function(i){h+='<button type="button" class="jeton'+(ok[i]?' place':'')+'" data-f="'+i+'"'+(ok[i]?' disabled':'')+'>'+p[i].f+'</button>';});
    J.corps.innerHTML=h+'</div>';
    J.corps.querySelectorAll('.mot-ar').forEach(function(b){b.addEventListener('click',function(){sel=+b.getAttribute('data-a');dessiner();});});
    J.corps.querySelectorAll('[data-f]').forEach(function(b){b.addEventListener('click',function(){
      if(sel===null){J.dire('Touche d\'abord un groupe de mots arabes.');return;}
      var i=+b.getAttribute('data-f');
      if(i===sel){ok[i]=true;sel=null;dessiner();J.dire('Abou Saïd hoche la tête.','ok');if(Object.keys(ok).length===p.length)J.terminer(true,'Tu as lu toute l\'inscription.');}
      else{J.secouer();J.dire('Abou Saïd sourit : « Non, ce mot-là dit autre chose. »','ko');}
    });});

JEUX.fuite=function(el,fin){
  var J=monterJeu(el,'La fuite nocturne','Guide Lucia (point rouge) dans les ruelles jusqu\'au port (lumière dorée), avant que la cloche ne sonne. Flèches du clavier ou boutons.',fin);
  var N=9,seed=1147;function rnd(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296;}
  var C=[],r,c;for(r=0;r<N;r++){for(c=0;c<N;c++)C.push({n:1,e:1,s:1,w:1,v:0});}
  function id(r,c){return r*N+c;}
  var pile=[[0,0]],vu={0:1};
  while(pile.length){var cur=pile[pile.length-1],cr=cur[0],cc=cur[1],vois=[];
    if(cr>0&&!vu[id(cr-1,cc)])vois.push([cr-1,cc,'n','s']);if(cc<N-1&&!vu[id(cr,cc+1)])vois.push([cr,cc+1,'e','w']);
    if(cr<N-1&&!vu[id(cr+1,cc)])vois.push([cr+1,cc,'s','n']);if(cc>0&&!vu[id(cr,cc-1)])vois.push([cr,cc-1,'w','e']);
    if(!vois.length){pile.pop();continue;}
    var nx=vois[Math.floor(rnd()*vois.length)];C[id(cr,cc)][nx[2]]=0;C[id(nx[0],nx[1])][nx[3]]=0;vu[id(nx[0],nx[1])]=1;pile.push([nx[0],nx[1]]);}
  var pos={r:0,c:0},t=75,fini=false;
  J.corps.innerHTML='<div class="labyrinthe-zone"><div class="labyrinthe" id="laby" style="grid-template-columns:repeat('+N+',1fr)"></div><div><p class="chrono" id="chrono" aria-live="off"></p><div class="pad"><span></span><button type="button" data-d="n" aria-label="Haut">▲</button><span></span><button type="button" data-d="w" aria-label="Gauche">◀</button><span></span><button type="button" data-d="e" aria-label="Droite">▶</button><span></span><button type="button" data-d="s" aria-label="Bas">▼</button><span></span></div></div></div>';
  function voir(){for(var rr=0;rr<N;rr++)for(var c2=0;c2<N;c2++){if(Math.abs(rr-pos.r)+Math.abs(c2-pos.c)<=2)C[id(rr,c2)].v=1;}}
  function dessiner(){voir();var h='';for(var rr=0;rr<N;rr++)for(var c2=0;c2<N;c2++){var k=C[id(rr,c2)],proche=Math.abs(rr-pos.r)+Math.abs(c2-pos.c)<=2,port=(rr===N-1&&c2===N-1);
      var bw=(k.n?3:0)+'px '+(k.e?3:0)+'px '+(k.s?3:0)+'px '+(k.w?3:0)+'px';
      h+='<div class="case'+(proche?' proche':(k.v?' vu':''))+'" style="border-width:'+((k.v||proche||port)?bw:'0')+'">'+(rr===pos.r&&c2===pos.c?'<span class="pion"></span>':'')+(port?'<span class="port"></span>':'')+'</div>';}
    $('laby').innerHTML=h;$('chrono').textContent='Cloche dans '+t+' s';}
  function bouger(d){if(fini)return;var k=C[id(pos.r,pos.c)];if(k[d])return;if(d==='n')pos.r--;if(d==='s')pos.r++;if(d==='e')pos.c++;if(d==='w')pos.c--;dessiner();
    if(pos.r===N-1&&pos.c===N-1){fini=true;arreter();J.terminer(true,'Tu atteins le port au moment où la cloche sonne.');}}
  J.corps.querySelectorAll('.pad button').forEach(function(b){b.addEventListener('click',function(){bouger(b.getAttribute('data-d'));});});
  function touche(e){var m={ArrowUp:'n',ArrowDown:'s',ArrowLeft:'w',ArrowRight:'e'}[e.key];if(m){e.preventDefault();bouger(m);}}
  document.addEventListener('keydown',touche);
  var minuteur=setInterval(function(){if(fini)return;t--;if(t<=0){t=0;fini=true;arreter();dessiner();J.terminer(false,'La cloche sonne : un garde t\'a vue.');return;}$('chrono').textContent='Cloche dans '+t+' s';},1000);
  function arreter(){clearInterval(minuteur);document.removeEventListener('keydown',touche);}
  nettoyages.push(arreter);
  dessiner();
};

JEUX.balance=function(el,fin){

    var h='<svg class="balance-svg" viewBox="0 0 360 200" role="img" aria-label="Balance du changeur"><rect x="150" y="180" width="60" height="12" rx="6" fill="#7a5530" stroke="#2a1c12"/><path d="M180 180V40" stroke="#2a1c12" stroke-width="4"/>'+
      '<path d="M'+lx+' '+ly+'L'+rx+' '+ry+'" stroke="#2a1c12" stroke-width="5" stroke-linecap="round"/><circle cx="180" cy="40" r="7" fill="#b0862a" stroke="#2a1c12"/>'+plateau(lx,ly,gauche)+plateau(rx,ry,droite)+'</svg>';

    });});

};

JEUX.echecs=function(el,fin){
  var J=monterJeu(el,'Échec et mat','Tu joues les pièces blanches du chevalier. Touche la tour (le roc), puis la case où elle doit aller pour que le roi noir ne puisse plus s\'échapper.',fin);
  var P={'a1':'R','g6':'K','g8':'k'},sel=null,essais=0,col='abcdefgh';
  function piece(t){
    if(!t)return '';var blanc=t!=='k',f=blanc?'#fffdf6':'#2a1c12',st=blanc?'#2a1c12':'#e6c86e';
    if(t==='R')return '<svg viewBox="0 0 40 40" width="78%" height="78%" aria-hidden="true"><path d="M9 35h22v-5H9zM13 30l1.5-12h11L27 30zM10 18h20V8h-4.5v4h-3V8h-5v4h-3V8H10z" fill="'+f+'" stroke="'+st+'" stroke-width="1.8" stroke-linejoin="round"/></svg>';
    return '<svg viewBox="0 0 40 40" width="80%" height="80%" aria-hidden="true"><path d="M20 3v9M15.5 7.5h9" stroke="'+st+'" stroke-width="2.4" stroke-linecap="round"/><path d="M9 35h22v-5H9zM11.5 30Q6 16 20 14Q34 16 28.5 30z" fill="'+f+'" stroke="'+st+'" stroke-width="1.8" stroke-linejoin="round"/></svg>';
  }
  function nom(t){return t==='R'?'tour blanche':t==='K'?'roi blanc':'roi noir';}
  function dessiner(){
    var h='<div class="echecs-zone"><div class="echiquier" role="grid" aria-label="Échiquier">';
    for(var r=8;r>=1;r--){for(var c=0;c<8;c++){var k=col[c]+r,t=P[k]||'';
      h+='<button type="button" data-k="'+k+'" class="'+(((c+r)%2)?'fo':'cl')+(sel===k?' sel':'')+'" aria-label="Case '+k+(t?' : '+nom(t):'')+'">'+piece(t)+'</button>';}}
    h+='</div><div class="echecs-aide"><b>Rappel</b><ul><li>La tour (le roc) avance en ligne droite, d\'autant de cases qu\'elle veut.</li><li>Le roi avance d\'une seule case, dans tous les sens.</li><li>« Mat » : le roi noir est attaqué et ne peut plus fuir.</li></ul></div></div>';
    J.corps.innerHTML=h;
    J.corps.querySelectorAll('.echiquier button').forEach(function(bt){bt.addEventListener('click',function(){
      var k=bt.getAttribute('data-k');
      if(!sel){if(P[k]==='R'){sel=k;dessiner();J.dire('Où va la tour ?');}else J.dire('Touche d\'abord la tour blanche.');return;}
      if(k===sel){sel=null;dessiner();return;}
      if(!((k[0]==='a'||k[1]==='1')&&k!==sel)){J.secouer();J.dire('La tour ne se déplace qu\'en ligne droite.','ko');return;}
      essais++;
      if(k==='a8'){P={'a8':'R','g6':'K','g8':'k'};sel=null;dessiner();J.terminer(true,'Échec et mat ! Le roi noir est attaqué sur sa ligne, et le roi blanc lui barre la route.');return;}
      if(essais>=3){J.terminer(false,'Le marchand sourit : il fallait jouer la tour en a8, tout au bout de sa ligne.');return;}
      J.secouer();J.dire('Le roi noir peut encore s\'échapper. Cherche une case d\'où la tour attaque toute sa ligne.','ko');
    });});
  }
  dessiner();
};

  var items=melange(S.carnet.filter(function(e){return CLASSE[e.k];})),i=0,place={},fautes={},nb=0;

      if(ok.indexOf(b)>=0){place[it.k]=b;if(!fautes[it.k])nb++;i++;J.dire(ok.length>1?'Oui. On aurait aussi pu la ranger ailleurs : plusieurs réponses sont justes.':'Oui, bien rangé.','ok');dessiner();
        if(i>=items.length){S.classe=place;J.terminer(true,'Tout est rangé : '+nb+' sur '+items.length+' du premier coup.');}}

        J.dire(ok[0]==='conflit'?'Regarde bien : ici, les rives ne s\'échangent rien, elles s\'opposent.':(b==='conflit'?'Ici, les rives ne s\'opposent pas : elles échangent quelque chose.':'C\'est bien un échange, mais d\'un autre genre.'),'ko');}
    });});

  if(!items.length){S.classe={};J.terminer(true,'Le carnet est vide.');return;}
  dessiner();
};

'9a':{n:9,acte:2,rub:'Acte II · En mer · été 1147',img:'mer',mus:'mer',titre:'Le détour',
 txt:["Tu baisses les yeux. Marco fonce droit devant, aperçoit une voile normande et doit fuir vers le large. Le navire perd une semaine à contourner les îles."],
 choix:[ch('Arriver enfin à Constantinople','10')]},
'9b':{n:9,acte:2,rub:'Acte II · En mer · été 1147',img:'mer',mus:'mer',titre:'Le passage des pêcheurs',
 entre:function(){conf(1,'Marco t\'est reconnaissant d\'avoir traduit.');},
 txt:["Tu traduis pour Marco : les pêcheurs connaissent un passage le long de la côte, à l'abri des navires normands. Marco hésite, puis suit leur conseil. Le soir, il te regarde autrement.",
  D('marco',"Tu es plus utile que je ne pensais.")],
 choix:[ch('Arriver à Constantinople','10')]},
'10':{n:10,acte:2,plan:'cple',doc:'buondelmonti',mus:'byzance',titre:'Le quartier vénitien',
 txt:function(){var n=nbVus(['11','12','13','14']);return ["Enfin, Constantinople. La ville est si grande qu'on ne voit pas où elle finit : des murailles, des coupoles, des palais, et partout des navires. Le vôtre accoste dans le quartier vénitien, sur la [[Corne d'Or]].",
  D('marco',"Tu as quelques jours pour connaître la ville. Ensuite, tu m'aideras à vendre au [[comptoir]]."),
  n<3?'Touche un lieu sur le plan. Visite au moins trois lieux avant de retourner au comptoir ('+n+' sur 3).':'Tu connais maintenant la ville. Marco t\'attend au comptoir.'];},
 choix:function(){var n=nbVus(['11','12','13','14']);return [ch('Sainte-Sophie','11'),ch('Le quartier des marchands musulmans','12'),ch('Le monastère de la Kécharitôménè','13'),ch('Les portes de la ville','14'),ch('Retourner au comptoir de Marco','15',{si:n>=3,raison:'trois lieux d\'abord'})];}},
'11':{n:11,acte:2,img:'cple',doc:'fossati',mus:'byzance',titre:'Sainte-Sophie',
 entre:function(){note('oppose','schisme','À Sainte-Sophie, on m\'explique que Grecs et Latins se sont excommuniés en 1054.','religion');},
 txt:["Tu entres dans Sainte-Sophie. Sous l'immense coupole, la lumière semble flotter. Les chants des prêtres résonnent en grec, et l'encens monte jusqu'aux mosaïques. Un jeune [[diacre]] remarque ta robe de Vénitienne et fronce les sourcils.",
  D('diacre',"Vous, les [[Latins]], vous prenez du pain sans levain pour la messe, et votre pape se croit au-dessus de notre [[patriarche]]. Depuis 1054, Rome et Constantinople se sont [[excommuniées]]."),
  "Tu ne savais pas que les chrétiens étaient divisés à ce point : c'est le [[schisme]]."],
 choix:[ch('Retourner au plan de la ville','10')]},
'12':{n:12,acte:2,img:'marche',mus:'byzance',titre:'Le quartier des marchands musulmans',
 txt:["Près du rivage se dresse le lieu de prière des marchands venus d'Égypte et de Syrie. Ici, dans la capitale de l'empereur chrétien, on entend parler arabe presque aussi souvent que grec. Un vieil homme à la barbe grise trie des cônes de cumin et de safran. Son regard s'arrête sur l'ourlet de ta robe.",
  D('abousaid',"Ce fil d'or ne vient pas de Venise. Montre-moi."),
  "Tu découds la bande de soie. Il la déchiffre mot à mot, sans te donner la traduction :",
  D('abousaid',"Baraka, c'est la bénédiction. Sâhib, celui qui possède. Tirâz, l'atelier où l'on brode. Bayt, la maison. Et Dimashq… tu devrais le savoir.")],
 jeu:{type:'tiraz',gagne:function(){souv(2);},perdu:function(){souv(1);},fini:function(){remplace('Bande de soie brodée','Tiraz déchiffré : Damas');note('relie','tiraz','Abou Saïd, marchand d\'Alep, lit ma broderie arabe à Constantinople.','culture');}},
 apres:function(){return [S.jeux['12']==='g'?'Abou Saïd replie la soie avec respect.':'Abou Saïd finit par traduire lui-même : la broderie vient d\'un atelier de Damas.',
  D('abousaid',"Les ateliers de Damas tissent ces bandes pour les familles qui comptent. Quelqu'un t'aimait beaucoup, petite."),
  "Puis, sans y penser, il fredonne un air de son pays. Ton cœur s'arrête : c'est ta berceuse."];},
 choix:[ch('Lui demander la route de Damas','12a'),ch('Retourner au plan de la ville','10')]},
'12a':{n:12,acte:2,img:'marche',mus:'byzance',titre:'La route de Damas',
 entre:function(){conf(1,'Abou Saïd te fait confiance.');},
 txt:[D('abousaid',"Par la mer jusqu'à Acre, puis avec une [[caravane]]. Les marchands passent, même quand les rois se font la guerre. Demande Youssouf le Damascain."),
  "Tu le remercies en arabe, et il éclate de rire."],
 choix:[ch('Retourner au plan de la ville','10')]},
'13':{n:13,acte:2,img:'anne',mus:'byzance',titre:'Le monastère de la Kécharitôménè',
 entre:function(){note('oppose','anne','Anne Comnène trouve les croisés brutaux et avides.','guerre');note('relie','aristote','Des savants latins viennent à Constantinople traduire les livres grecs.','culture');},
 txt:["Marco t'envoie livrer des étoffes au monastère de la [[Kécharitôménè]]. Une femme âgée t'y reçoit, entourée de livres : Anne Comnène, fille de l'empereur Alexis. Elle écrit l'histoire du règne de son père.",
  D('anne',"Les premiers croisés sont passés ici quand j'étais jeune fille. Des barbares, avides et brutaux. Pourtant, regarde : des savants latins viennent jusqu'ici pour traduire Aristote."),
  D('anne',"Une servante vénitienne qui comprend le grec et un peu d'arabe… D'où viens-tu vraiment ?")],
 choix:[ch('Raconter ton histoire','13a'),ch('Rester discrète et repartir','10')]},
'13a':{n:13,acte:2,img:'anne',mus:'byzance',titre:'La lettre d\'Anne Comnène',
 entre:function(){objet('Lettre d\'Anne Comnène');conf(1,'Anne Comnène t\'accorde sa confiance.');},
 txt:["Tu lui racontes la soie brodée, la berceuse, la cour aux arbres. Anne Comnène t'écoute sans t'interrompre. Puis elle écrit quelques lignes, scelle la lettre et te la tend.",
  D('anne',"Pour Théodoros, un marchand grec d'Acre. Il te logera. Les femmes doivent s'entraider, même quand elles ne sont pas du même monde.")],
 choix:[ch('Retourner au plan de la ville','10')]},
'14':{n:14,acte:2,img:'cple',mus:'byzance',titre:'Les croisés aux portes',
 entre:function(){note('oppose','francs','Les croisés de Louis VII et les Grecs se méfient les uns des autres.','guerre');},
 txt:["En octobre, une immense armée campe devant les murailles : les croisés du roi de France, Louis VII. L'empereur Manuel les reçoit avec faste, mais fait garder les portes.",
  "Dans la foule, tu aperçois la reine Aliénor d'Aquitaine, à cheval, entourée de ses dames : elle accompagne son mari à la croisade.",
  "Dans le camp, des chevaliers murmurent qu'il faudrait plutôt s'emparer de Constantinople et de ses richesses. Les Grecs, eux, comptent les jours avant le départ de ces encombrants alliés."],
 choix:[ch('Retourner au plan de la ville','10')]},
'15':{n:15,acte:2,img:'cple',mus:'byzance',titre:'La décision',
 txt:["Le soir, Marco compte ses bénéfices, l'air satisfait.",
  D('marco',"Bonne saison. Au printemps, nous rentrons à Venise. Tu rentres avec moi."),
  "Tu sais maintenant que ta famille est à Damas. Si tu rentres à Venise, tu ne la reverras jamais."],
 choix:function(){return [ch('Négocier ta liberté avec Marco','15a',{si:S.conf>=3,cache:true}),ch('Fuir de nuit vers le port','15b'),ch('Rester à Constantinople, au service du monastère (ton voyage s\'arrête là)','15c')];}},
'15c':{n:15,acte:2,img:'anne',mus:'byzance',titre:'Rester au monastère ?',
 txt:["Le monastère de la [[Kécharitôménè]] accueille des femmes seules. Tu y serais libre, à l'abri, et tu passerais tes journées parmi les livres.",
  "Mais réfléchis bien : si tu restes à Constantinople, ton voyage s'arrête ici. Tu ne partiras pas à la recherche de ta famille, et l'aventure se termine."],
 choix:[ch('Oui, je reste au monastère et l\'aventure se termine','finC'),ch('Non, je cherche un autre moyen de partir','15')]},
'15a':{n:15,acte:2,img:'cple',mus:'byzance',titre:'La parole de Marco',
 entre:function(){S.f.libre=true;objet('Promesse d\'affranchissement');},
 txt:["Tu prends ton courage à deux mains.",D('nour',"J'ai gagné une part de cette saison. Je voudrais ma liberté."),
  "Marco réfléchit longtemps, puis prend une plume et rédige une promesse d'affranchissement.",
  D('marco',"Ma tante grognera, mais une parole est une parole. Tu es libre.")],
 choix:[ch('Aller chez le changeur du port','16')]},
'15b':{n:15,acte:2,img:'cple',mus:'poursuite',titre:'La fuite nocturne',
 txt:["Cette nuit, tu glisses ta soie dans ta ceinture et tu sors sans bruit. Le port est à l'autre bout du quartier, et les gardes vénitiens font leur ronde. Trouve ton chemin dans les ruelles avant que la cloche ne sonne."],
 jeu:{type:'fuite',perdu:function(){conf(-1,'Un garde t\'a vue : la nouvelle de ta fuite court le quartier.');}},
 apres:function(){return [S.jeux['15b']==='g'?'Un patron de navire pisan, qui n\'aime pas les Vénitiens, accepte de te cacher à son bord.':'Tu échappes au garde de justesse, au lever du jour, et tu te caches sur un navire pisan.','Avant d\'embarquer, il te faut de l\'or pour payer ton passage.'];},
 choix:[ch('Aller chez le changeur du port','16')]},
'16':{n:16,acte:2,img:'cple',mus:'byzance',titre:'La balance du changeur',
 txt:["Un [[changeur]] grec tient boutique près du port, avec sa balance et ses poids. Sur son comptoir, quatre pièces d'or : deux [[hyperpères]] de l'empereur et deux [[dinars]] d'Égypte.",
  D('changeur',"Ici, l'or byzantin et l'or des califes se valent : on les pèse, on ne les juge pas."),
  D('marin2',"Méfie-toi, petite : il glisse toujours une pièce [[rognée]] dans le lot.")],
 jeu:{type:'balance',gagne:function(){S.deniers=Math.max(0,S.deniers-12);S.hyper=1;bourse('Tu échanges tes deniers contre un [[hyperpère]] d\'or de bon poids.');},perdu:function(){S.deniers=0;S.hyper=1;bourse('Ton hyperpère t\'a coûté toutes tes économies.',true);},fini:function(){note('relie','or','Chez le changeur, l\'or byzantin et l\'or d\'Égypte se valent.','économie');}},
 apres:["Le lendemain, tu embarques pour Acre, ton hyperpère cousu dans ta ceinture."],
 choix:[ch('Prendre la mer vers Acre','17')]},
'17':{n:17,acte:3,rub:'Acte III · En mer · printemps 1148',img:'pirates',mus:'poursuite',titre:'Les pirates',
 entre:function(){note('oppose','pirates','Des corsaires d\'Égypte nous ont pris en chasse : chrétiens et musulmans font la course en mer.','guerre');},
 txt:["Au large de Rhodes, la vigie crie. À l'horizon, une [[galère]] grossit à chaque coup de rame. Ton sang se glace : tu revois le navire de ton enfance.",
  D('capitaine',"Des corsaires d'Égypte ! Ils guettent les navires chrétiens, comme nos corsaires guettent les leurs. Avec ce vent, nous pouvons les distancer, mais sans vent, leurs rameurs nous rattraperont. Vite, petite, aide-moi à guetter les rafales !"),
  "Cette fois, tu n'es plus une enfant : tu peux agir."],
 jeu:{type:'pirates',perdu:function(){if(S.hyper>0){S.hyper=0;bourse('Le capitaine paie les corsaires avec l\'or des passagers : tu perds ton hyperpère.',true);}}},
 apres:function(){return [S.jeux['17']==='g'?'Le navire entre dans le port de Rhodes. La galère fait demi-tour. Le capitaine te serre la main : sans toi, ils auraient été pris.':'La galère vous rattrape. Les corsaires ne veulent pas de prisonniers aujourd\'hui, seulement de l\'or : le capitaine paie pour tout le monde, avec l\'argent des passagers.','Quelques jours plus tard, la côte de Syrie apparaît.'];},
 choix:[ch('Débarquer à Acre','17b')]},
'17b':{n:18,acte:3,img:'acre',mus:'acre',titre:'Une réfugiée d\'Édesse',
 entre:function(){note('oppose','edesse','À Édesse, les soldats de Zengi puis de Nur ad-Din ont tué des habitants chrétiens et vendu femmes et enfants.','guerre');},
 txt:["Sur le quai d'Acre, des [[réfugiés]] attendent un navire. Une femme arménienne serre un petit garçon contre elle. Elle vient d'[[Édesse]], une ville chrétienne du Nord, à plusieurs jours de marche.",
  D('refugiee',"Il y a quatre ans, l'[[émir]] Zengi a pris notre ville et fait tuer les Francs. Puis, il y a deux ans, son fils Nur ad-Din est revenu. Ses soldats ont massacré les hommes, brûlé les églises, et emmené les femmes et les enfants pour les vendre comme esclaves. Ma fille était parmi eux."),
  "Tu te figes. Une petite fille arrachée aux siens et vendue loin de chez elle : comme toi. Cette fois, ce sont des soldats musulmans qui l'ont prise.",
  D('refugiee',"C'est pour Édesse que le pape a appelé à la croisade. Mais la guerre ne me rendra pas ma fille.")],
 encart:{t:'Édesse, 1144 et 1146',l:["Décembre 1144 : l'émir Zengi prend Édesse, capitale d'un des États fondés par les croisés. Cette chute pousse le pape et Bernard de Clairvaux à appeler à la deuxième croisade.","1146 : les Francs reprennent la ville quelques jours, et pillent eux aussi les boutiques des musulmans et des chrétiens. Nur ad-Din la reprend : les hommes sont massacrés, les femmes et les enfants réduits en esclavage.","Le chroniqueur chrétien Michel le Syrien parle de 30 000 morts et 16 000 esclaves pour les deux sièges. Les chroniques exagèrent souvent les chiffres : l'historien les vérifie."]},
 choix:[ch('Entrer dans la ville','18')]},
'18':{n:18,acte:3,img:'acre',mus:'acre',titre:'Le port d\'Acre',
 entre:function(){if(!a('Lettre d\'Anne Comnène'))conf(-1,'Sans lettre de recommandation, on se méfie de toi.');},
 txt:function(){var n=nbVus(['19','20','20b']);return ["Voici Acre, le grand port des [[Francs]] en Orient. Vénitiens, Génois et Pisans y ont chacun leur quartier. Dans les rues, tu entends du latin, du grec, de l'arabe et de l'hébreu.",
  a('Lettre d\'Anne Comnène')?D('theodoros',"Une lettre d'Anne Comnène ! Entre, ma fille : ma maison est la tienne."):'Sans recommandation, tu trouves une place de servante dans une auberge du port. Le patron se méfie de toi.',
  n<1?'Explore au moins un lieu avant le grand conseil des croisés.':'On dit que les rois tiendront bientôt conseil près de la ville.'];},
 choix:function(){var n=nbVus(['19','20','20b']);return [ch('Le moulin à sucre','19'),ch('Le souk d\'Acre','20'),ch('Une partie d\'échecs','20b'),ch('Servir au grand conseil des croisés','21',{si:n>=1,raison:'un lieu d\'abord'})];}},
'19':{n:19,acte:3,img:'acre',mus:'acre',titre:'Le moulin à sucre',
 txt:["Hors des murs, des champs de cannes à sucre s'étendent jusqu'à la mer. Au moulin, un [[contremaître]] syrien cherche des bras pour la journée.",
  D('contremaitre',"Les Francs ont appris de nous comment on fait le sucre. Si tu sais dans quel ordre on travaille, je te paie six [[dirhams]].")],
 jeu:{type:'moulin',gagne:function(){S.dirhams+=6;bourse('Le contremaître te paie 6 dirhams d\'argent.');},fini:function(){note('relie','sucre','Les Francs d\'Acre font du sucre comme les paysans du pays.','gastronomie');}},
 apres:function(){return [S.jeux['19']==='g'?'Les pains de sucre partent ensuite vers Venise. Tu repenses aux cônes blancs du Rialto : tu sais maintenant d\'où ils venaient.':'Le contremaître te renvoie sans payer. Tu pourras revenir plus tard tenter ta chance.'];},
 choix:function(){return [ch(S.f.caravaneAttente?'Retourner voir Youssouf':'Revenir en ville',S.f.caravaneAttente?'23':'18')];}},
'20':{n:20,acte:3,img:'acre',mus:'acre',titre:'Le souk d\'Acre',
 entre:function(){souv(1);note('relie','medecin','Un médecin syrien soigne un chevalier franc.','culture');note('relie','caravanes','Les caravanes de Damas commercent en pleine guerre.','économie');},
 txt:["Sous une arcade, un médecin syrien chrétien soigne un chevalier franc fiévreux. Son apprenti te glisse :",
  D('apprenti',"Les Francs se moquent de nous, mais ils viennent tous se faire soigner ici !"),
  "Plus loin, des caravaniers arrivés de Damas vendent des abricots secs et des étoffes : le commerce continue, malgré la guerre. Tu goûtes un abricot, et le goût te ramène d'un coup dans la cour de ton enfance."],
 choix:[ch('Revenir en ville','18')]},
'20b':{n:20,acte:3,img:'echecs',mus:'acre',titre:'Une partie d\'échecs',
 txt:["Sous une treille, un chevalier franc et un marchand de Damas sont penchés sur un plateau de soixante-quatre cases : ils jouent aux [[échecs]]. Autour d'eux, des curieux parient quelques pièces. Malgré la guerre, les deux hommes rient ensemble.",
  D('joueur',"Vous, les Francs, vous avez appris ce jeu chez nous. Et nous, nous le tenons des Perses, qui l'avaient reçu des Indiens. Le roi, chez eux, c'est le shâh."),
  D('chevalier',"Peu importe d'où il vient : ce soir, il me fait perdre ! Toi, petite, tu as l'air vive. Aide-moi : il y a un coup qui gagne la partie d'un seul coup.")],
 jeu:{type:'echecs',bouton:'Aider le chevalier à trouver le coup gagnant',gagne:function(){conf(1,'Le chevalier te remercie et parle de toi autour de lui.');},fini:function(){note('relie','echecs','Les échecs, venus d\'Inde par la Perse et les Arabes, se jouent à Acre entre Francs et musulmans.','culture');}},
 apres:function(){return [S.jeux['20b']==='g'?D('chevalier',"Échec et mat ! Ah, mon ami, cette fois, c'est moi qui gagne !"):D('chevalier',"Tant pis, je perds encore. Mais tu as bien essayé."),
  D('joueur',"Sais-tu d'où vient ce mot, « mat » ? En persan, shâh mât veut dire : le roi est abandonné, il ne peut plus fuir. Et votre tour, vous l'appelez le roc, du persan rukh."),
  "Le chevalier et le marchand rangent les pièces et se serrent la main. Demain, peut-être, leurs peuples se battront."];},
 choix:[ch('Revenir en ville','18')]},
'21':{n:21,acte:3,img:'acre',mus:'acre',titre:'Le conseil d\'Acre',
 entre:function(){note('oppose','conseil','Au conseil d\'Acre, les rois décident d\'attaquer Damas, pourtant longtemps alliée.','guerre');},
 txt:["Le 24 juin 1148, tu sers l'eau sous les tentes du grand [[conseil]] des croisés. Tu reconnais Louis VII. À ses côtés se tiennent l'empereur allemand Conrad III et une femme au regard ferme : Mélisende, reine de Jérusalem, qui gouverne le royaume avec son jeune fils Baudouin III.",
  "Les chefs décident d'attaquer Damas. Un vieux baron du pays proteste :",
  D('baron',"Damas a longtemps été notre alliée contre l'[[émir]] d'Alep ! L'attaquer, c'est nous faire un ennemi de plus."),
  "On ne l'écoute pas. Ton cœur se serre : c'est la ville de ta famille."],
 choix:[ch('Réfléchir à ce que tu vas faire','22')]},
'22':{n:22,acte:3,img:'acre',mus:'acre',titre:'Avant la marche sur Damas',
 txt:["L'armée va marcher sur Damas. Tu as deux façons de t'y rendre : partir avec une caravane pour arriver avant l'armée, ou suivre l'armée comme servante et interprète, sans rien payer."],
 choix:[ch('Chercher la caravane de Youssouf','23'),ch('Suivre l\'armée comme servante et interprète','27',{fx:function(){S.f.armee=true;}})]},
'23':{n:23,acte:3,img:'acre',mus:'acre',titre:'La caravane de Youssouf',
 entre:function(){S.f.caravaneAttente=true;},
 txt:function(){return ["Youssouf le Damascain charge ses chameaux devant la porte de l'Est.",
  D('youssouf',"Une place dans ma caravane, c'est un hyperpère d'or, ou six dirhams. Les routes ne sont pas sûres, en ce moment."),
  S.hyper>0||S.dirhams>=6?'Ta bourse est assez garnie pour payer.':(S.conf>=3?'Ta bourse est vide, mais Youssouf a entendu parler de toi en bien.':'Ta bourse est vide. Il faudrait gagner quelques dirhams, ou trouver un autre moyen.')];},
 choix:function(){var l=[];
  if(S.hyper>0)l.push(ch('Payer avec ton hyperpère','23b',{fx:function(){S.hyper=0;S.dirhams+=2;bourse('Tu paies ta place ; Youssouf te rend 2 dirhams de monnaie.');}}));
  else if(S.dirhams>=6)l.push(ch('Payer six dirhams','23b',{fx:function(){S.dirhams-=6;bourse('Tu paies ta place : 6 dirhams.');}}));
  l.push(ch('Lui demander de t\'emmener sans payer','23b',{si:S.conf>=3,cache:true,fx:function(){annonce('Youssouf accepte : on lui a dit que tu étais digne de confiance.','conf');}}));
  if(S.jeux['19']!=='g')l.push(ch('Travailler au moulin pour gagner des dirhams','19',{fx:function(){if(S.jeux['19']==='p')delete S.jeux['19'];}}));
  l.push(ch('Renoncer et suivre l\'armée','27',{fx:function(){S.f.armee=true;}}));
  return l;}},
'23b':{n:23,acte:3,img:'acre',mus:'acre',titre:'Les mots voyageurs',
 entre:function(){S.f.caravaneAttente=false;},
 txt:["Avant le départ, Youssouf veut s'assurer que tu comprends l'arabe. Il étale ses marchandises et t'en fait répéter les noms."],
 jeu:{type:'memoire',fini:function(){note('relie','mots','Sucre, orange, chiffre : ces mots français viennent de l\'arabe.','culture');}},
 apres:function(){return [S.jeux['23b']==='g'?D('youssouf',"Tu parles comme une fille de Damas ! Je t'accorde ma protection, l'[[amân]]."):D('youssouf',"Tu as encore des progrès à faire… Mais viens quand même."),'Des mots, comme des pièces, ont fait le voyage d\'une rive à l\'autre.'];},
 choix:[ch('Prendre la route de Damas','24')]},
'24':{n:24,acte:4,img:'damas',mus:'damas',titre:'L\'arrivée à Damas',
 entre:function(){note('relie','omeyyades','La grande mosquée de Damas abrite le tombeau de Jean le Baptiste, vénéré par tous.','culture');},
 txt:["La caravane entre dans Damas par la porte de l'Est. La grande [[mosquée]] des Omeyyades occupe l'emplacement d'une ancienne basilique ; on y vénère encore le tombeau de Jean le Baptiste, prophète pour les musulmans comme pour les chrétiens.",
  "Mais partout, on renforce les [[remparts]]. L'armée croisée approche. Tu as peu de temps."],
 choix:[ch('Courir au souk des soieries','25')]},
'25':{n:25,acte:4,img:'soieries',mus:'damas',titre:'Le souk des soieries',
 entre:function(){note('relie','etoffes','Damas, Mossoul, Bagdad : des étoffes portent le nom de leur ville.','économie');},

/* ============ RENDU : une scène tient sur un écran, le texte se lit page par page ============ */
var PAGE=0,PAGES=[],MODEJEU=false,carnetNouveau=false,carteNouveau=false;
var NOMJEU={cargaison:'la cargaison',tiraz:'le tiraz',fuite:'la fuite',balance:'la balance du changeur',pirates:'la poursuite',moulin:'le moulin à sucre',memoire:'les mots voyageurs',etoffes:'les étoffes voyageuses',preuve:'les souvenirs',echecs:'la partie d\'échecs',classement:'le classement'};
var COURT={barbari:"Jacopo de' Barbari, Vue de Venise, 1500",carpaccio:"Carpaccio, le Rialto, vers 1496",bellini:"Gentile Bellini, la place Saint-Marc, 1496",canaletto:"Canaletto, l'intérieur de Saint-Marc, XVIIIe siècle",cuisine:"Une cuisine, Tacuinum sanitatis, fin du XIVe siècle",arsenal:"De' Barbari, l'Arsenal, 1500 (détail)",buondelmonti:"Buondelmonti, plan de Constantinople, 1422",fossati:"Fossati et Haghe, Sainte-Sophie, 1852"};

function nettoyer(){nettoyages.forEach(function(f){try{f();}catch(e){}});nettoyages=[];}
function aller(id){
  recents=[];annonces=[];S.scene=id;PAGE=0;MODEJEU=false;var sc=SC[id];S.vus[id]=true;
  if(sc&&sc.entre&&!S.faits[id]){S.faits[id]=true;sc.entre();}
  if(sc&&sc.fin)S.f.derniereFin=id;
  var dej=S.f.etapes||[];etapesVues().forEach(function(e){if(dej.indexOf(e.k)<0){dej.push(e.k);carteNouveau=true;annonce('Nouvelle étape sur ta carte : <b>'+e.n+'</b> ('+e.a+'). <button type="button" class="lien-carte ouvrir-carte">Voir la carte</button>','carte');}});S.f.etapes=dej;
  sauver();rendre();
  if(sc&&sc.mus)musique(sc.mus);else if(id==='guide')musique('mer');
}
function isHub(id){return id==='2'||id==='10'||id==='18';}
function construireChoix(c,liste){
  if(!c)return;c.innerHTML='';
  var vis=liste.filter(function(o){return !(o.si===false&&o.cache);});
  c.classList.toggle('deux',vis.length>3);
  vis.forEach(function(o){var b=document.createElement('button');b.type='button';var dispo=o.si!==false;
    var tag=!dispo?(o.raison||''):(isHub(S.scene)&&S.vus[o.go]&&SC[o.go]&&!SC[o.go].fin?'déjà visité':'');
    if(o.jeu)b.className='btn-jeu';
    b.innerHTML='<span class="fleche">'+(o.jeu?'✦':'❧')+'</span><span>'+o.l+'</span>'+(tag?'<span class="renvoi">'+tag+'</span>':'');
    b.disabled=!dispo;
    b.addEventListener('click',function(){if(o.fx)o.fx();if(o.action)o.action();else aller(o.go);});c.appendChild(b);});
}
function lettrine(c){return '<svg class="lettrine" viewBox="0 0 80 80" aria-hidden="true"><rect x="2" y="2" width="76" height="76" rx="12" fill="#b0862a" stroke="#2a1c12" stroke-width="2"/><rect x="8" y="8" width="64" height="64" rx="8" fill="#22397e"/><path d="M12 68 Q20 50 14 36 Q26 44 30 30 M68 12 Q58 22 66 34 Q52 30 50 44" fill="none" stroke="#e6c86e" stroke-width="1.8"/><circle cx="14" cy="36" r="3" fill="#a3301c"/><circle cx="66" cy="34" r="3" fill="#a3301c"/><text x="41" y="60" text-anchor="middle" font-family="\'Uncial Antiqua\',\'Palatino Linotype\',serif" font-size="50" fill="#f0d98a" stroke="#2a1c12" stroke-width="1">'+c.toUpperCase()+'</text></svg>';}
function bloc(item,premier){
  if(typeof item==='object'&&item)return dialogue(item.q,item.d);
  if(premier&&!document.body.classList.contains('lecture')&&/^[A-Za-zÀ-ÿ]/.test(item)){
    var l=item.charAt(0);return '<p class="lettrine-p"><span style="position:absolute;left:-9999px">'+l+'</span>'+lettrine(l)+fmt(item.slice(1))+'</p>';
  }
  return '<p>'+fmt(item)+'</p>';
}
function encartHtml(e){return '<div class="encart"><h3>'+e.t+'</h3><ul>'+e.l.map(function(x){return '<li>'+fmt(x)+'</li>';}).join('')+'</ul></div>';}
function rubrique(gauche,droite){
  var voix=('speechSynthesis' in window)?'<button type="button" class="btn-voix" id="btn-voix" aria-pressed="false">🔊 Écouter</button>':'';
  return '<div class="rubrique-haut"><span>'+gauche+'</span><span class="droite">'+voix+'<span class="fol">'+droite+'</span></span></div>';
}
function blocAnnonces(){
  if(!annonces.length)return '';
  return '<div class="annonces" aria-live="polite">'+annonces.map(function(x){var ic=x.g==='carte'?ICO.plan:x.g==='souv'?ICO.souv:x.g==='conf'?ICO.conf:x.g==='bourse'?ICO.bourse:x.g==='baisse'?ICO.baisse:ICO.info;return '<div class="annonce'+(x.g==='baisse'?' baisse':'')+'">'+ic+'<span>'+fmt(x.t)+'</span></div>';}).join('')+'</div>';
}
function vignetteDoc(k){
  var d=DOCS[k],img=(typeof IMG!=='undefined'&&IMG[k])?IMG[k]:'';if(!d||!img)return '';
  return '<button type="button" class="vignette-doc" data-doc="'+k+'"><img src="'+img+'" alt=""><span><b>Document d\'époque</b>'+(COURT[k]||d.t)+'<span class="petit">Touche pour l\'agrandir</span></span></button>';
}
/* Coquille d'une page : image à gauche, texte à droite (ou pleine largeur) */
function coquille(o){
  var h='<div class="scene'+(o.plein?' plein':'')+'">';
  if(!o.plein)h+='<div class="col-illus'+(o.doc?' avec-doc':'')+'"><div class="illus">'+o.illus+'</div>'+(o.legende?'<p class="legende">'+o.legende+'</p>':'')+(o.doc?vignetteDoc(o.doc):'')+'</div>';
  h+='<div class="col-texte">'+rubrique(o.rub,o.fol)+(o.titre?'<h2 class="lieu">'+o.titre+'</h2>':'')+'<div class="page-texte" id="page-texte"></div><div class="pied-page" id="pied"></div></div></div>';
  $('folio').innerHTML=h;
}
function navHtml(suite){
  return '<div class="nav-page"><button type="button" class="btn-page" data-p="-1"'+(PAGE===0?' disabled':'')+'>← Page précédente</button><span class="num-page">Page '+(PAGE+1)+' sur '+Math.max(1,PAGES.length)+'</span>'+(suite?'<button type="button" class="btn-suite btn-page" data-p="1">Suite →</button>':'<span></span>')+'</div>';
}
function paginer(blocs){
  var box=$('page-texte');PAGES=[];var cur=[];box.innerHTML='';
  blocs.forEach(function(b){
    box.insertAdjacentHTML('beforeend',b);
    if(cur.length&&box.scrollHeight>box.clientHeight+2){PAGES.push(cur);cur=[b];box.innerHTML=b;}
    else cur.push(b);
  });
  PAGES.push(cur);
}
var FINAL=null;
function monterPages(blocs,final){
  FINAL=final;
  $('pied').innerHTML='<div class="choix" id="choix"></div>'+navHtml(false);final();
  paginer(blocs);
  if(PAGE>=PAGES.length)PAGE=PAGES.length-1;
  afficherPage();
}
function afficherPage(){
  var box=$('page-texte');box.innerHTML=PAGES[PAGE].join('');box.scrollTop=0;
  var der=PAGE===PAGES.length-1,pied=$('pied');
  if(der){pied.innerHTML='<div class="choix" id="choix"></div>'+(PAGES.length>1?navHtml(false):'');FINAL();}
  else pied.innerHTML=navHtml(true);
  brancherVoix();
}
function tourner(d){var n=PAGE+d;if(n<0||n>=PAGES.length)return;PAGE=n;stopVoix();fermerBulle();afficherPage();var s=$('pied').querySelector('.btn-suite')||$('pied').querySelector('#choix button');if(s)s.focus({preventScroll:true});}

function rendre(){
  nettoyer();stopVoix();fermerBulle();
  if(S.scene==='titre'){rendreTitre();}
  else if(S.scene==='guide'){rendreGuide();}
  else if(S.scene==='ecrit'){rendreEcrit();}
  else rendreScene();
  majCarnet();  majBoutonCarte();
}
function folDe(sc){return sc.fin?sc.fin:(sc.fol||'§ '+romain(sc.n));}
function rendreScene(){
  var id=S.scene,sc=SC[id];
  if(MODEJEU&&sc.jeu&&!S.jeux[id]){
    $('folio').innerHTML='<div class="scene plein"><div class="col-texte">'+rubrique(sc.rub||ACTES[sc.acte],folDe(sc))+'<div class="zone-jeu" id="zone-jeu"></div></div></div>';
    JEUX[sc.jeu.type]($('zone-jeu'),function(g){finJeu(id,g);});brancherVoix();return;
  }
  var plan=sc.plan;
  coquille({illus:plan?'<div class="plan-boite">'+(plan==='venise'?planVenise({interactif:true}):planCple({interactif:true}))+'</div>':MINI[sc.img](),
    legende:plan?(plan==='venise'?'Plan de Venise : touche un lieu pour t\'y rendre':'Plan de Constantinople : touche un lieu pour t\'y rendre'):LEG[sc.img],
    doc:sc.doc,rub:sc.rub||ACTES[sc.acte],fol:folDe(sc),titre:sc.titre});
  var blocs=[],an=blocAnnonces();if(an)blocs.push(an);
  var jeuFait=sc.jeu&&S.jeux[id];
  var corps=jeuFait?val(sc.apres||[]):val(sc.txt);
  if(!sc.jeu&&sc.apres)corps=corps.concat(val(sc.apres));
  corps.forEach(function(p,i){blocs.push(bloc(p,i===0&&!jeuFait));});
  if(!sc.jeu||jeuFait){if(sc.encart)blocs.push(encartHtml(sc.encart));if(sc.fin)blocs.push(blocFin());}
  monterPages(blocs,function(){
    if(sc.jeu&&!S.jeux[id])construireChoix($('choix'),[{l:sc.jeu.bouton||('Commencer l\'épreuve : '+NOMJEU[sc.jeu.type]),jeu:true,action:function(){MODEJEU=true;rendre();}}]);
    else if(sc.fin)construireChoix($('choix'),[{l:'Faire le bilan de mon voyage',action:function(){aller('bilan');}},{l:'Recommencer le voyage',action:recommencer}]);
    else construireChoix($('choix'),val(sc.choix));
  });
}
function finJeu(id,g){nettoyer();recents=[];annonces=[];MODEJEU=false;PAGE=0;S.jeux[id]=g?'g':'p';var j=SC[id].jeu;if(g&&j.gagne)j.gagne();if(!g&&j.perdu)j.perdu();if(j.fini)j.fini();sauver();rendre();}
function blocFin(){return '<div class="encart"><h3>Une fin parmi d\'autres</h3><ul><li>Ce voyage a quatre fins possibles. Tes choix, et ce que tu as su gagner en chemin, ont décidé de celle-ci.</li><li>Fais maintenant le bilan de ce que tu as vu, puis rejoue pour découvrir les autres.</li></ul></div>';}

function rendreTitre(){
  var sauve=lireStock(CLE),peut=sauve&&sauve.scene&&sauve.scene!=='titre'&&(SC[sauve.scene]||sauve.scene==='guide'||sauve.scene==='ecrit');
  coquille({illus:MINI.couverture(),legende:LEG.couverture,rub:'Un récit dont tu es l\'héroïne',fol:'fol. i'});
  monterPages(['<h2 class="titre-jeu">D\'une rive à l\'autre</h2>',
    bloc("Venise, printemps 1147. Tu t'appelles Lucia, tu as quatorze ans, et tu es esclave dans la maison d'une marchande vénitienne. Mais tu n'es pas née à Venise : de ton enfance, il te reste une berceuse, l'odeur d'une cour plantée d'arbres et une bande de soie brodée de lettres que tu ne sais pas lire.",true),
    '<p>Ton voyage commence en pleine deuxième croisade. Où te mènera-t-il ? À toi de le découvrir.</p>',
    encartHtml({t:'Avant de commencer',l:['Joue sur un ordinateur, l\'écran en largeur. Le bouton « Plein écran », en haut, agrandit le manuscrit.','Tu n\'as jamais besoin de faire défiler : le bouton « Suite » tourne les pages.','Mets le son, ou des écouteurs. Durée : 35 minutes environ.']})],
    function(){var l=[{l:'Ouvrir le manuscrit',action:function(){demarrerSon();S=neuf();aller('guide');}}];
      if(peut)l.unshift({l:'Reprendre ma partie',action:function(){demarrerSon();S=sauve;aller(S.scene);}});
      construireChoix($('choix'),l);});
}
function fiche(ic,t,p){return '<div class="fiche">'+ic+'<div><h3>'+t+'</h3><p>'+fmt(p)+'</p></div></div>';}

   '<div class="guide">'+
   fiche(ICO.carnet,'Mon carnet',"Le bouton « Mon carnet », en haut, l'ouvre quand tu veux : tes souvenirs, ta confiance, ta bourse et ce que tu portes. Un point rouge signale du nouveau.")+

   fiche(ICO.conf,'La confiance',"Elle monte quand tu aides, écoutes ou te confies, et baisse quand tu échoues. Tes choix comptent.")+
